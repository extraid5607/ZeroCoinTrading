services:
  - type: web
    name: zerocoin-trading
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_SOURCE
        value: live
      - key: DELTA_REGION
        value: india
